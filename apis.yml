aid: fetch-rewards
name: Fetch Rewards
description: 'Fetch (legally Fetch Rewards, LLC) is a Madison, Wisconsin consumer rewards
  platform whose mobile app lets shoppers scan paper receipts, connect e-receipts and
  link accounts to earn points redeemable for gift cards and other rewards. On the
  demand side, Fetch For Business sells consumer packaged goods brands, retailers and
  restaurants receipt-verified offers, video and display advertising, point boosts,
  loyalty programs and omnichannel audience activation, all measured against real purchase
  data and managed through its Mission Control campaign platform. Fetch publishes no
  public developer or partner API and operates no developer portal; its only public
  machine-readable contract is the Receipt Processor reference OpenAPI it publishes
  on GitHub as an engineering hiring exercise. It does run a coordinated vulnerability
  disclosure program via HackerOne and publishes an RFC 9116 security.txt, and its
  GitHub organization ships several first-party open-source Swift and Python developer
  libraries.'
