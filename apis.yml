apis:
- aid: fetch-rewards:receipt-processor
  name: Fetch Receipt Processor (Reference Specification)
  description: 'A two-operation OpenAPI 3.0.3 document Fetch publishes in its public
    GitHub organization as the specification for its engineering take-home exercise:
    submit a receipt for processing and retrieve the points awarded for that receipt.
    It is a reference contract, not a hosted production service - the document declares
    no servers, no security schemes and no operationIds, and Fetch exposes no public
    endpoint implementing it. It is captured here because it is the only machine-readable
    contract Fetch publishes, and it faithfully describes the shape of the receipt and
    line-item data at the core of the Fetch product.'
